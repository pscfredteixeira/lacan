name: Publish narrated lesson 4.5
on:
  push:
    paths:
      - '.github/workflows/publish-lesson-45-audio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download narration from temporary staging
        shell: bash
        env:
          SOURCE_URL: https://at.adobe.com/vvw2RKCTeVia7mib
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 --retry-delay 3 -o assets/pequeno-outro-45.mp3 "$SOURCE_URL"
          test "$(wc -c < assets/pequeno-outro-45.mp3)" -gt 100000
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1 assets/pequeno-outro-45.mp3
      - name: Publish narrated lesson MP3
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pequeno-outro-45.mp3
          git diff --cached --quiet || git commit -m "Publish narrated audio for small-other lesson"
          git push origin HEAD:main
