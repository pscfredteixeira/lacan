name: Align Lacan 4.1 Narration
on:
  push:
    paths:
      - ".github/workflows/align-narration-41.yml"
permissions:
  contents: write
jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install accurate speech alignment
        run: |
          python -m pip install --disable-pip-version-check -q faster-whisper==1.2.1
      - name: Extract time-aligned Portuguese words
        shell: bash
        run: |
          python - <<'PY'
          import json
          import av
          old_open=av.open
          def compatible_open(*args, **kwargs):
              kwargs.pop('metadata_errors',None)
              return old_open(*args,**kwargs)
          av.open=compatible_open
          from faster_whisper import WhisperModel
          model=WhisperModel("small", device="cpu", compute_type="int8", cpu_threads=4, num_workers=2)
          segments,info=model.transcribe(
              "assets/imagem-corporal.mp3", language="pt",
              beam_size=5, best_of=5,
              word_timestamps=True,
              vad_filter=False,
              initial_prompt="Jacques Lacan, psicanálise, imagem corporal, corpo vivido, Gestalt, estádio do espelho."
          )
          output=[]
          for segment in segments:
              words=[{"text":w.word,"start":round(w.start,2),"end":round(w.end,2),"prob":round(w.probability,3)} for w in (segment.words or [])]
              output.append({"start":round(segment.start,2),"end":round(segment.end,2),"text":segment.text.strip(),"words":words})
          with open("narration-alignment-41.json","w",encoding="utf-8") as fp:
              json.dump({"language":info.language,"duration":info.duration,"segments":output},fp,ensure_ascii=False,indent=2)
          print("ALIGNED",len(output),"segments;",sum(len(s["words"]) for s in output),"words")
          print("FIRST",output[:2])
          PY
      - name: Save timing evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add narration-alignment-41.json
          git commit -m "chore: measured word timings for 4.1 narration"
          git push
