name: Publicar áudio da aula 3.6
on:
  push:
    paths:
      - ".github/workflows/publicar-narracao-36.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Transferir MP3 para o repositório
        env:
          AUDIO_URL: "https://at.adobe.com/mNKKEPCkGC2XDtzl"
        run: |
          mkdir -p assets
          curl --fail --location --show-error --silent --retry 3 --connect-timeout 20 --max-time 150 "$AUDIO_URL" -o assets/formacoes-inconsciente.mp3
          python3 - <<'PY'
          from pathlib import Path
          audio=Path('assets/formacoes-inconsciente.mp3').read_bytes()
          assert 200000 < len(audio) < 10000000, f"Arquivo com tamanho inesperado: {len(audio)}"
          assert audio[:3] == b'ID3' or (audio[0]==0xff and (audio[1] & 0xe0)==0xe0), f"Arquivo não parece ser MP3: {audio[:12]!r}"
          print(f"MP3 validado, {len(audio)} bytes")
          PY
      - name: Publicar narração no GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/formacoes-inconsciente.mp3
          git diff --cached --quiet || git commit -m "feat(audio): publicar narracao MP3 da aula 3.6"
          git push
